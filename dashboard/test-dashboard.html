<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Debug Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .test { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Dashboard Debug Test</h1>

  <div id="test1" class="test">
    <h3>Test 1: Config Check</h3>
    <div id="test1-result">Running...</div>
  </div>

  <div id="test2" class="test">
    <h3>Test 2: API Runs Endpoint</h3>
    <div id="test2-result">Running...</div>
  </div>

  <div id="test3" class="test">
    <h3>Test 3: Static Assets</h3>
    <div id="test3-result">Running...</div>
  </div>

  <div id="test4" class="test">
    <h3>Test 4: Module Loading</h3>
    <div id="test4-result">Running...</div>
  </div>

  <script>
    // Test 1: Check config
    function test1() {
      const result = document.getElementById('test1-result');
      const config = { mode: 'server', baseUrl: '/test-dashboard' };
      result.innerHTML = `<pre>${JSON.stringify(config, null, 2)}</pre>`;
      document.getElementById('test1').classList.add('success');
    }

    // Test 2: Test API
    async function test2() {
      const result = document.getElementById('test2-result');
      try {
        const response = await fetch('/test-dashboard/api/runs?limit=1');
        const data = await response.json();
        result.innerHTML = `<pre>Status: ${response.status}\nRuns found: ${data.runs.length}\nLatest: ${data.latest}</pre>`;
        document.getElementById('test2').classList.add('success');
      } catch (error) {
        result.innerHTML = `<pre>Error: ${error.message}</pre>`;
        document.getElementById('test2').classList.add('error');
      }
    }

    // Test 3: Check static assets
    async function test3() {
      const result = document.getElementById('test3-result');
      try {
        const cssRes = await fetch('/test-dashboard/assets/css/dashboard.css');
        const jsRes = await fetch('/test-dashboard/assets/js/dashboard.js');
        result.innerHTML = `<pre>CSS: ${cssRes.status}\nJS: ${jsRes.status}</pre>`;
        document.getElementById('test3').classList.add('success');
      } catch (error) {
        result.innerHTML = `<pre>Error: ${error.message}</pre>`;
        document.getElementById('test3').classList.add('error');
      }
    }

    // Test 4: Test module import
    async function test4() {
      const result = document.getElementById('test4-result');
      try {
        const module = await import('/test-dashboard/assets/js/data-loader.js');
        result.innerHTML = `<pre>DataLoader class: ${typeof module.DataLoader}\ncreateDataLoader: ${typeof module.createDataLoader}</pre>`;
        document.getElementById('test4').classList.add('success');
      } catch (error) {
        result.innerHTML = `<pre>Error: ${error.message}\nStack: ${error.stack}</pre>`;
        document.getElementById('test4').classList.add('error');
      }
    }

    // Run all tests
    test1();
    test2();
    test3();
    test4();
  </script>
</body>
</html>
