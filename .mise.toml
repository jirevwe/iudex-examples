# mise configuration for iudex-examples
# https://mise.jdx.dev/

[tools]
node = "18"

# Dashboard Examples

[tasks.express]
description = "Run Express server with dashboard"
run = """
cd express-dashboard
npm install
npm start
"""

[tasks.fastify]
description = "Run Fastify server with dashboard"
run = """
cd fastify-dashboard
npm install
npm start
"""

[tasks.standalone]
description = "Run standalone HTTP server with dashboard"
run = """
cd standalone-dashboard
npm install
npm start
"""

# Test Examples

[tasks."test:httpbin"]
description = "Run HTTPBin integration tests"
run = """
cd httpbin-tests
npm install
npm test
"""

[tasks."test:simple"]
description = "Run simple tests"
run = """
cd simple-tests
npm install
npm test
"""

[tasks."test:failures"]
description = "Run failure case tests"
run = """
cd failure-tests
npm install
npm test
"""

[tasks."test:governance"]
description = "Run governance and security tests"
run = """
cd governance-security-tests
npm install
npm test
"""

[tasks."test:all"]
alias = "test"
description = "Run all tests"
run = [
  "mise run test:httpbin",
  "mise run test:simple",
  "mise run test:failures",
  "mise run test:governance"
]

# Utility Tasks

[tasks.install]
description = "Install dependencies for all examples"
run = """
for dir in express-dashboard fastify-dashboard standalone-dashboard httpbin-tests simple-tests failure-tests governance-security-tests; do
  echo "Installing dependencies in $dir..."
  cd $dir && npm install && cd ..
done
"""

[tasks.clean]
description = "Clean node_modules from all examples"
run = """
for dir in express-dashboard fastify-dashboard standalone-dashboard httpbin-tests simple-tests failure-tests governance-security-tests; do
  echo "Cleaning $dir..."
  rm -rf $dir/node_modules $dir/package-lock.json
done
"""
